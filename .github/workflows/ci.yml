name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --redact --log-opts='--all --full-history -m' .
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Test physics, scoring, units and the leaderboard API
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Install the sharing-preview test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Check production sharing HTML and images
        env:
          CHROME_CHANNEL: chromium
          TEST_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 "$TEST_URL" --output /dev/null
          npm run test:sharing
      - name: Check local API and browser security policy
        env:
          CHROME_CHANNEL: chromium
          CLOUDFLARE_TEST_URL: http://127.0.0.1:8787
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --no-install wrangler d1 migrations apply chillhill-leaderboard --local --persist-to "$RUNNER_TEMP/chillhill-security-state"
          npx --no-install wrangler dev --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/chillhill-security-state" &
          worker_pid=$!
          api_pid=
          cleanup() {
            if [ -n "$api_pid" ]; then kill "$api_pid" 2>/dev/null || true; fi
            kill "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 "$CLOUDFLARE_TEST_URL" --output /dev/null
          npm run test:cloudflare &
          api_pid=$!
          browser_status=0
          npm run test:security || browser_status=$?
          api_status=0
          wait "$api_pid" || api_status=$?
          api_pid=
          if [ "$api_status" -ne 0 ] || [ "$browser_status" -ne 0 ]; then
            echo "::error::API check exit status: $api_status; browser security check exit status: $browser_status"
            exit 1
          fi
      - name: Keep the verified site for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chillhill-site
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://chillhill.maurimura.dev
    concurrency:
      group: chillhill-production
      cancel-in-progress: false
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download the verified site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: chillhill-site
          path: dist/
      - name: Apply pending database migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '5b2d633eadd0f2e2a9c9f773f5e7a1d0'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the repository Actions secret CLOUDFLARE_API_TOKEN, then re-run this job.'
            exit 1
          fi
          npm run db:migrate:remote
          npx --no-install wrangler deploy --strict
      - name: Verify the deployed game and public leaderboard
        run: node scripts/deployment-check.mjs
